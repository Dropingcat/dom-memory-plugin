[project]
name = "opencode-dom-memory"
version = "0.2.3"
description = "DOM project-memory engine (append-only claims + plan tree + hash-chained ledger) and its stdio MCP server for OpenCode."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30",
    "anyio>=4.15",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=2.8"]   # optional: DOM_LLM_PROVIDER=anthropic extraction provider
test = ["pytest>=9.1"]

[tool.setuptools]
packages = ["mockup", "mockup.fixtures"]