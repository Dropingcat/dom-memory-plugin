[project]
name = "dom-memory-plugin"
version = "0.3.0"
description = "DOM project-memory plugin (Claude Code + OpenCode): append-only claims, plan tree, hash-chained ledger in <project>/.dom-memory, stdio MCP server."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.30",
    "anyio>=4.15",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=2.8"]   # optional: DOM_LLM_PROVIDER=anthropic extraction provider
test = ["pytest>=9.1"]

[tool.setuptools]
packages = []   # the engine ships inside the host trees (claude/, opencode/); nothing is pip-installed from the repo root
